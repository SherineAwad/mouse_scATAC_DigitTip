    group1: 3xAmp
    group2: 1xAmp

  - name: 5xAmp_1xAmp
    group1: 5xAmp
    group2: 1xAmp

  - name: 1xAmp_control
    group1: 1xAmp
    group2: control

  - name: 3xAmp_control
    group1: 3xAmp
    group2: control

  - name: 5xAmp_control
    group1: 5xAmp
    group2: control

annotate:
