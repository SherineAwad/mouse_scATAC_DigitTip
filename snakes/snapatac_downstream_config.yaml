  - peaks: 3xAmp_control_significant_results.csv
    prefix: 3xAmp_vs_Control

  - peaks: 5xAmp_control_significant_results.csv
    prefix: 5xAmp_vs_Control

motif:
  - peaks: 3xAmp_1xAmp_all_results.csv
    prefix: motifs_3xAmp_1xAmp

  - peaks: 5xAmp_1xAmp_all_results.csv
    prefix: motifs_5xAmp_1xAmp

gene_linkage:
  - name: 5xAmp_1xAmp

  - name: 3xAmp_1xAmp
